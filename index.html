<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾光小径 · 像素冒险</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#ecf5ef;background:#101e26}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#29464c,transparent 65%),#101e26;padding:26px 18px}.shell{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.eyebrow{color:#8cc9b5;font-size:11px;letter-spacing:4px}h1{font-size:28px;letter-spacing:3px;margin:6px 0 0}h1 span{font-size:12px;letter-spacing:2px;color:#98b2b5;font-weight:400}.badge{border:1px solid #466369;border-radius:30px;padding:9px 14px;font-size:12px;color:#b8d6ce}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:#1d333c;border:1px solid #3c5359;border-bottom:0;border-radius:12px 12px 0 0}.stats{display:flex;gap:30px}.stat{font-size:10px;letter-spacing:2px;color:#9eb5b9}.stat strong{display:block;font-size:21px;letter-spacing:1px;color:#fff5d8;margin-top:3px;font-variant-numeric:tabular-nums}.actions{display:flex;gap:8px}button{font:inherit;cursor:pointer;color:#dcefe8;background:#314c53;border:1px solid #537078;border-radius:6px;padding:9px 13px;touch-action:manipulation}button:hover{background:#43636a}button:focus-visible{outline:3px solid #ffe19b;outline-offset:3px}.stage{position:relative;overflow:hidden;border:1px solid #48636a;background:#92c9cb;aspect-ratio:960/540}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#10283175;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.card{max-width:440px;margin:16px;padding:32px;text-align:center;background:#152d35f2;border:1px solid #7b9b91;border-radius:12px;box-shadow:0 18px 70px #0c202960}.card .icon{color:#ffdc85;font-size:30px}.card h2{font-size:27px;margin:12px 0}.card p{color:#b7cdd0;font-size:14px;line-height:1.9;margin:0 0 22px}.primary{background:#f2cc7a;border-color:#f2cc7a;color:#263a35;font-weight:700;padding:12px 30px}.primary:hover{background:#ffe2a3}footer{display:flex;justify-content:space-between;gap:12px;color:#9eb5b9;font-size:12px;padding:16px 2px;line-height:1.8}kbd{background:#263d45;border:1px solid #486169;border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:#e3f1e8}.touch{display:flex;justify-content:space-between;padding-top:8px;user-select:none}.touch div{display:flex;gap:10px}.touch button{min-width:60px;padding:14px;touch-action:none}.note{font-size:11px;color:#75959d;letter-spacing:1px}@media(min-width:900px) and (pointer:fine){.touch{display:none}}@media(max-width:600px){body{padding:12px 8px}h1{font-size:21px}h1 span,.badge{display:none}.bar{padding:10px;gap:8px}.stats{gap:15px}.stat{letter-spacing:0}.stat strong{font-size:17px}.actions button{font-size:12px;padding:8px}.card{padding:18px}.card h2{font-size:22px}.card p{font-size:12px;margin-bottom:12px}footer{font-size:10px;flex-wrap:wrap}}
</style>
</head>
<body><main class="shell">
<header><div><div class="eyebrow">LITTLE TRAIL / PIXEL ADVENTURE</div><h1>拾光小径 <span>向着日落，跳一小步。</span></h1></div><div class="badge">01 / 林间原野</div></header>
<div class="bar"><div class="stats"><div class="stat">SCORE · 分数<strong id="score">000000</strong></div><div class="stat">COINS · 金币<strong id="coins">00</strong></div><div class="stat">LIVES · 生命<strong id="lives">♥ ♥ ♥</strong></div></div><div class="actions"><button id="pause">暂停</button><button id="restart">重新开始</button></div></div>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="拾光小径横版平台游戏"></canvas><div class="overlay" id="overlay"><div class="card"><div class="icon">✦</div><h2 id="title">小小旅人，出发吧。</h2><p id="message">跃过沟壑，收集沿途的金币。<br>从上方踩扁小怪，顶开问号箱，找到山脚的旗杆。</p><button class="primary" id="play">开始冒险 →</button></div></div></div>
<footer><span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> 移动　 <kbd>空格</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> 跳跃　 <kbd>P</kbd> 暂停</span><span class="note">原创几何像素绘制 · 无外部资源</span></footer>
<div class="touch"><div><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button></div><button data-key="jump">跳跃 ↥</button></div>
</main><script src="game.js"></script></body></html>
